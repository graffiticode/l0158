steps:
  # Install dependencies
  - name: 'node'
    entrypoint: 'npm'
    args:
      - 'ci'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/graffiticode/l0158:$COMMIT_SHA'
      - '.'

  # Push image to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - 'gcr.io/graffiticode/l0158:$COMMIT_SHA'
    id: Push

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - run
      - deploy
      - l0158
      - '--platform=managed'
      - '--image=gcr.io/graffiticode/l0158:$COMMIT_SHA'
      - >-
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      # L0158 holds no credential (capability spec SECRET-01): L0176 signs its
      # previews through Broker. Cloud Run carries a revision's env vars and
      # secret mounts over to the next one unless a deploy removes them, so
      # every deploy removes LEARNOSITY_KEY, LEARNOSITY_SECRET and the retired
      # GRAFFITICODE_SECRET_KEY (get-val-private decryption, once mounted
      # out-of-band by the console's set-compiler-secret.sh).
      # --remove-env-vars can't be combined with --set-env-vars, hence
      # --update-env-vars.
      - '--update-env-vars=AUTH_URL=$_AUTH_URL'
      - '--remove-env-vars=LEARNOSITY_KEY'
      - '--remove-secrets=LEARNOSITY_SECRET,GRAFFITICODE_SECRET_KEY'
      - '--allow-unauthenticated'
    id: Deploy
    entrypoint: gcloud

images:
  - 'gcr.io/graffiticode/l0158:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _DEPLOY_REGION: us-central1
  _AUTH_URL: https://auth.graffiticode.org

tags:
  - l0158
